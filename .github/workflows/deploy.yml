name: Deploy to Hostinger (desguace.cochecierto.com)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to Hostinger FTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST || secrets.FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER || secrets.FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD || secrets.FTP_PASSWORD }}
          # Directorio de destino en Hostinger para el subdominio desguace.cochecierto.com
          # Por defecto apunta a la carpeta del subdominio: public_html/desguace/
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || 'public_html/desguace/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/specs/**
            **/docs/**
            README.md
            deploy_hostinger.py
            iniciar_desguace.bat
            test_*.php
            tests/**
            __pycache__/**
            api/data/*.json
            api/data/*.sqlite
            api/data/*.db
