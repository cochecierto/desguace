<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Acceso Personal · Centro CAT</title>
  <link rel="stylesheet" href="styles-public.css?v=20260911-3">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }
    .auth-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      width: 100%;
      max-width: 420px;
      padding: 36px 32px;
    }
    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
      color: inherit;
    }
    .auth-brand b {
      background: #008060;
      color: #fff;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 700;
    }
    .auth-brand span {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    .auth-brand small {
      display: block;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px 0;
      letter-spacing: -0.4px;
    }
    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #008060;
      box-shadow: 0 0 0 3px rgba(0, 128, 96, 0.15);
    }
    .auth-btn {
      width: 100%;
      background: #008060;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
      margin-top: 24px;
    }
    .auth-btn:hover {
      background: #006b50;
    }
    .auth-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .feedback {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    .feedback.error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block;
    }
    .feedback.success {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block;
    }
    .auth-foot {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }
    .auth-foot a {
      color: #008060;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-brand">
      <b>D</b>
      <span>DESGUACE<small>CENTRO AUTORIZADO CAT</small></span>
    </a>

    <h1>Centro Operativo CAT</h1>
    <p class="subtitle">Acceso restringido para el personal del desguace y gestión telemática.</p>

    <div id="authAlert" class="feedback"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="inputEmail">Correo corporativo</label>
        <input type="email" id="inputEmail" required placeholder="admin@desguace.com" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="inputPassword">Contraseña de operador</label>
        <input type="password" id="inputPassword" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="auth-btn" id="btnSubmit">
        <span>Acceder al Panel CAT</span>
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="auth-foot">
      🔒 Conexión cifrada y auditoría de accesos activa.<br>
      <a href="index.html">← Volver a la web comercial</a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const form = document.querySelector('#loginForm');
  const alertEl = document.querySelector('#authAlert');
  const btnSubmit = document.querySelector('#btnSubmit');

  // Si ya tiene sesión activa, redirigir automáticamente
  try {
    const res = await fetch('api/auth.php?action=check');
    const data = await res.json();
    if (data.authenticated) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || 'operaciones.html';
      window.location.href = redirect;
      return;
    }
  } catch (err) {
    console.warn('Error verificando sesión:', err);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertEl.className = 'feedback';
    alertEl.style.display = 'none';

    const email = document.querySelector('#inputEmail').value.trim();
    const password = document.querySelector('#inputPassword').value;

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = 'Verificando credenciales…';

    try {
      const res = await fetch('api/auth.php?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        alertEl.textContent = 'Acceso concedido. Cargando centro operativo…';
        alertEl.className = 'feedback success';

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'operaciones.html';
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      } else {
        alertEl.textContent = data.error || 'Credenciales no válidas. Comprueba correo y contraseña.';
        alertEl.className = 'feedback error';
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'Acceder al Panel CAT →';
      }
    } catch (err) {
      alertEl.textContent = 'Error al conectar con el servidor. Revisa tu conexión.';
      alertEl.className = 'feedback error';
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = 'Acceder al Panel CAT →';
    }
  });
});
</script>

</body>
</html>
